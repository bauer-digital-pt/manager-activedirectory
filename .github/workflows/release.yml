name: Release

# Builds the Manager Windows installer and publishes it to GitHub Releases so
# electron-updater clients auto-update. Triggered by pushing a version tag
# (e.g. `git tag v1.0.1 && git push origin v1.0.1`) or run manually from the
# Actions tab. `release:manager` bakes `--publish always` into the leaf
# electron-builder call, so BOTH paths publish (tag push and manual dispatch);
# the release goes out as a full release (see the `releaseType: release` publish
# config). NOTE: do not use `npm run build -- --publish always` here — the flag
# is silently dropped when forwarded through the nested `npm run build:manager`.
#
# The Agent is a SEPARATE product with its own auto-update feed
# (agent-activedirectory). That feed repo does not exist yet, and the default
# GITHUB_TOKEN is scoped to THIS repo only so it could not publish there anyway.
# So we BUILD the Agent as a PORTABLE .exe on every release and ATTACH it to the
# SAME GitHub Release as an extra downloadable .exe. This is a plain release asset,
# NOT a feed publish: a portable target emits no latest.yml at all, and we upload
# ONLY the .exe, so the Manager feed stays Manager-only and electron-updater
# clients never cross-update to the Agent. `build:agent` bakes `--win portable
# --publish never` so a tag push can't trip electron-builder's CI auto-publish into
# the (missing) agent feed repo. A portable does NOT auto-update (there is no
# installer) — that is inherent. To turn on real Agent auto-update later: switch
# build:agent back to an nsis installer, create the public agent-activedirectory
# repo, add a cross-repo token secret, and use `npm run release:agent`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create the GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard against a mismatched release: the pushed tag (e.g. v1.0.28) must
      # equal the version in package.json, otherwise electron-updater clients get
      # a build whose version disagrees with the release tag.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      # Typecheck BOTH tsconfigs. The build's `tsc` only checks the renderer
      # (tsconfig.json); the main/preload project (tsconfig.node.json) was never
      # verified in CI, so a type error there could ship. `npm run build` still
      # runs its own `tsc`, but failing fast here gives a clearer signal.
      - name: Typecheck
        run: npm run typecheck

      - name: Build Manager installer & publish to GitHub Releases
        env:
          # The default Actions token; the permissions block above grants it
          # contents:write. electron-builder reads GH_TOKEN for the GitHub publisher.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:manager

      # Build a PORTABLE Manager .exe (a single self-contained exe that runs with
      # no install) and attach it to the SAME GitHub Release as an extra download.
      # Like the Agent attach below, this is a plain release asset — NEVER a feed
      # publish: we build with --publish never and upload ONLY the *-Portable-*.exe,
      # never a latest.yml, so the Manager auto-update feed stays nsis-only and the
      # fleet is never affected. build:portable re-bakes the Manager renderer, so it
      # is correct regardless of the Agent build that follows. Portable builds do
      # NOT auto-update (there is no installer) — that is inherent to a portable app.
      - name: Build Manager portable (no publish)
        run: npm run build:portable

      - name: Attach Manager portable to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "Uploading Manager portable to release $VERSION"
          gh release upload "$VERSION" release/manager/*Portable*.exe --clobber

      # Build the Agent flavor too (separate APP_FLAVOR bake, separate output
      # dir release/agent), as a PORTABLE .exe, but NEVER publish it — see the
      # header comment. Runs after the Manager publish so a failure here can't
      # block the fleet update that already went out. No GH_TOKEN: `--publish
      # never` needs none. The Agent portable self-extracts to %TEMP%\ADAgent.
      - name: Build Agent portable (no publish)
        run: npm run build:agent

      # Attach the Agent portable .exe to the SAME GitHub Release as an extra
      # download. A portable emits no latest.yml, so there is nothing that could
      # hijack the Manager's update feed. The release is tagged v<version>
      # (electron-builder's default), computed from package.json so this works on
      # both tag push and manual dispatch. The on-disk name has a space
      # ("AD Agent-Portable-<version>.exe"); the bash glob expands it as a single
      # path.
      - name: Attach Agent portable to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "Uploading Agent installer to release $VERSION"
          gh release upload "$VERSION" release/agent/*.exe --clobber
